[build-system]
requires = ["setuptools>=47.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwcom"
version = "1.0.1"
authors = [
    {name = 'Matthieu Charbonnier', email = 'matthieu.charbonnier@aledia.com'},
]
keywords = ['hardware', 'communication']
description = 'hardware communication interface'
license.text = 'Proprietary'
dependencies = [
    'pyserial==3.4',
    'potable @ git+https://gitlab.com/Charbonnier/Saveable#egg=potable'
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools.packages.find]
where = ["src"]